# 公网只开放 HTTPS；导入、查询、图片和流式接口均通过本机服务转发。
server {
    listen 80;
    server_name 129.211.229.10;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name 129.211.229.10;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/129.211.229.10/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/129.211.229.10/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 200m;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_buffering off;

    location = / {
        return 302 /chat.html;
    }

    location = /import {
        proxy_pass http://127.0.0.1:8000;
    }

    location = /upload {
        proxy_pass http://127.0.0.1:8000;
    }

    location ^~ /status/ {
        proxy_pass http://127.0.0.1:8000;
    }

    location / {
        proxy_pass http://127.0.0.1:8001;
    }
}
